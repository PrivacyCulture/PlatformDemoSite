<!doctype html>
<html lang="en-GB">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0b1220" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/brand/pcl-icon-32.png" type="image/png" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/brand/pcl-icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/brand/pcl-icon-apple-180.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		%sveltekit.head%
	
	
	<!-- Cookiebot in manual blocking mode, loaded async so it doesn't hold up first paint. Each
	     tracker below is type="text/plain" with a data-cookieconsent category, and Cookiebot
	     only runs it once the visitor has accepted that category. A new third-party script
	     needs the same two attributes, or it runs before consent. -->
	<script id="Cookiebot" src="https://consent.cookiebot.com/uc.js" data-cbid="3943241c-aa8a-44cf-848d-824f4c223931" async></script>
	
	
		<!-- Google tag (gtag.js) -->
	<script type="text/plain" data-cookieconsent="statistics" async src="https://www.googletagmanager.com/gtag/js?id=G-M67X8M2TQR"></script>
	<script type="text/plain" data-cookieconsent="statistics">
	window.dataLayer = window.dataLayer || [];
	function gtag(){dataLayer.push(arguments);}
	gtag('js', new Date());

	gtag('config', 'G-M67X8M2TQR');
	</script>

	<!-- HubSpot and Hotjar cost the most main-thread time, so they wait until the visitor first
	     interacts, or 4s after the page has loaded, whichever comes first. This helper sets
	     nothing and loads nothing itself, so it runs before consent. -->
	<script>
	window.pclWhenIdle = function (fn) {
		var done = false;
		var events = ['pointerdown', 'keydown', 'scroll', 'touchstart'];
		var opts = { passive: true };
		function run() {
			if (done) return;
			done = true;
			events.forEach(function (e) { removeEventListener(e, run, opts); });
			fn();
		}
		events.forEach(function (e) { addEventListener(e, run, opts); });
		function arm() { setTimeout(run, 4000); }
		if (document.readyState === 'complete') arm();
		else addEventListener('load', arm, { once: true });
	};
	</script>

	<!-- Hotjar Tracking Code for platform.privacyculture.com -->
	<script type="text/plain" data-cookieconsent="statistics">
	(function(h,o,t,j,a,r){
		h.hj=h.hj||function(){(h.hj.q=h.hj.q||[]).push(arguments)};
		h._hjSettings={hjid:6785893,hjsv:6};
		h.pclWhenIdle(function(){
			a=o.getElementsByTagName('head')[0];
			r=o.createElement('script');r.async=1;
			r.src=t+h._hjSettings.hjid+j+h._hjSettings.hjsv;
			a.appendChild(r);
		});
	})(window,document,'https://static.hotjar.com/c/hotjar-','.js?sv=');
	</script>

	<!-- HubSpot tracking. Cookiebot is the only consent banner, so HubSpot's own banner is off
	     and HubSpot is told what the visitor chose in Cookiebot, again whenever they change it. -->
	<script type="text/plain" data-cookieconsent="statistics, marketing">
	window.disableHubSpotCookieBanner = true;
	(function () {
		var _hsp = (window._hsp = window._hsp || []);
		function syncConsent() {
			var c = window.Cookiebot && window.Cookiebot.consent;
			if (!c) return;
			_hsp.push(['setHubSpotConsent', {
				analytics: !!c.statistics,
				advertisement: !!c.marketing,
				functionality: !!c.preferences
			}]);
		}
		syncConsent();
		addEventListener('CookiebotOnConsentReady', syncConsent);
		window.pclWhenIdle(function () {
			var s = document.createElement('script');
			s.id = 'hs-script-loader';
			s.async = true;
			s.src = 'https://js-eu1.hs-scripts.com/6136080.js';
			document.head.appendChild(s);
		});
	})();
	</script>
	
	</head>
	<body data-sveltekit-preload-data="hover" class="overflow-x-hidden bg-ink font-sans text-bone antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
