<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320">
  <!-- Node constellation echoing the Visual ROPA View: one gold hub, satellite nodes on
       gold-to-lens gradient lines. The default picture in the Next step box (site.demoCta.image). -->
  <style>
    .pulse {
      transform-origin: 300px 150px;
      transform-box: view-box;
      animation: pulse 3.2s ease-out infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.85); opacity: 0.9; }
      100% { transform: scale(1.9); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; opacity: 0.4; }
    }
  </style>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af6a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#009bcc" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="hub">
      <stop offset="0%" stop-color="#d4af6a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d4af6a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g stroke="url(#line)" stroke-width="1.6">
    <line x1="300" y1="150" x2="120" y2="60"/>
    <line x1="300" y1="150" x2="470" y2="48"/>
    <line x1="300" y1="150" x2="90" y2="230"/>
    <line x1="300" y1="150" x2="500" y2="236"/>
    <line x1="300" y1="150" x2="300" y2="278"/>
    <line x1="300" y1="150" x2="410" y2="130"/>
    <line x1="300" y1="150" x2="190" y2="160"/>
  </g>
  <g stroke="rgba(247,250,252,0.28)" stroke-width="1" stroke-dasharray="3 5">
    <line x1="120" y1="60" x2="190" y2="160"/>
    <line x1="470" y1="48" x2="410" y2="130"/>
    <line x1="500" y1="236" x2="300" y2="278"/>
  </g>

  <circle cx="300" cy="150" r="62" fill="url(#hub)"/>
  <circle class="pulse" cx="300" cy="150" r="30" fill="none" stroke="#d4af6a" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="300" cy="150" r="20" fill="#103389" stroke="#d4af6a" stroke-width="2"/>
  <circle cx="300" cy="150" r="5" fill="#d4af6a"/>

  <g fill-opacity="0.16">
    <circle cx="120" cy="60" r="13" fill="#009bcc"/>
    <circle cx="470" cy="48" r="12" fill="#d4af6a"/>
    <circle cx="90" cy="230" r="11" fill="rgba(247,250,252,0.55)"/>
    <circle cx="500" cy="236" r="14" fill="#009bcc"/>
    <circle cx="300" cy="278" r="11" fill="#d4af6a"/>
    <circle cx="410" cy="130" r="10" fill="rgba(247,250,252,0.55)"/>
    <circle cx="190" cy="160" r="10" fill="#d4af6a"/>
  </g>
  <g fill="#0b1220" stroke-width="2">
    <circle cx="120" cy="60" r="7" stroke="#009bcc"/>
    <circle cx="470" cy="48" r="6" stroke="#d4af6a"/>
    <circle cx="90" cy="230" r="5" stroke="rgba(247,250,252,0.55)"/>
    <circle cx="500" cy="236" r="8" stroke="#009bcc"/>
    <circle cx="300" cy="278" r="5" stroke="#d4af6a"/>
    <circle cx="410" cy="130" r="4" stroke="rgba(247,250,252,0.55)"/>
    <circle cx="190" cy="160" r="4" stroke="#d4af6a"/>
  </g>
</svg>
